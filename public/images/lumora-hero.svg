<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Lumora - Live beautifully. Clothing, Electronics, Furniture, Shoes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="card"><rect width="1200" height="900" rx="56"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#355240" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="900" fill="#E7E7DB"/>
    <circle cx="1060" cy="90" r="230" fill="#D1D6C6"/>
    <circle cx="140" cy="820" r="250" fill="#DAC8B7"/>
    <circle cx="1090" cy="800" r="60" fill="#D1D6C6" opacity="0.7"/>
    <circle cx="90" cy="130" r="36" fill="#DAC8B7" opacity="0.7"/>

    <!-- central circle -->
    <circle cx="600" cy="450" r="290" fill="#F4F2E9" stroke="#DCDCCF" stroke-width="2" filter="url(#soft)"/>
    <text x="600" y="490" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="220" fill="#4F6347">L.</text>
    <text x="600" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="9" fill="#6E7566">LIVE BEAUTIFULLY</text>

    <!-- category badges -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#355240" text-anchor="middle">
      <!-- Clothing -->
      <g transform="translate(330,250)">
        <circle r="62" fill="#fff" stroke="#C9D0BD" stroke-width="2" filter="url(#soft)"/>
        <path d="M-28,-22 L-12,-30 Q0,-20 12,-30 L28,-22 L20,-4 L12,-8 L12,28 L-12,28 L-12,-8 L-20,-4 Z" fill="none" stroke="#355240" stroke-width="3.5" stroke-linejoin="round"/>
        <text y="-84">Clothing</text>
      </g>
      <!-- Electronics -->
      <g transform="translate(870,250)">
        <circle r="62" fill="#fff" stroke="#C9D0BD" stroke-width="2" filter="url(#soft)"/>
        <rect x="-26" y="-22" width="52" height="34" rx="4" fill="none" stroke="#355240" stroke-width="3.5"/>
        <path d="M-36,24 H36" stroke="#355240" stroke-width="3.5" stroke-linecap="round"/>
        <text y="-84">Electronics</text>
      </g>
      <!-- Furniture -->
      <g transform="translate(330,650)">
        <circle r="62" fill="#fff" stroke="#C9D0BD" stroke-width="2" filter="url(#soft)"/>
        <path d="M-16,-28 V2 M16,-28 V2 M-16,-28 H16 M-22,2 H22 M-18,2 V28 M18,2 V28" fill="none" stroke="#355240" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="100">Furniture</text>
      </g>
      <!-- Shoes -->
      <g transform="translate(870,650)">
        <circle r="62" fill="#fff" stroke="#C9D0BD" stroke-width="2" filter="url(#soft)"/>
        <path d="M-30,18 V4 Q-30,0 -24,0 L-10,-4 Q-4,-6 0,-10 L4,-14 L12,-6 Q20,0 28,4 Q32,6 32,12 V18 Z" fill="none" stroke="#355240" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M-30,25 H32" stroke="#355240" stroke-width="3.5" stroke-linecap="round"/>
        <text y="100">Shoes</text>
      </g>
    </g>

    <text x="600" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="6" fill="#5B6B52">THOUGHTFULLY CHOSEN, BEAUTIFULLY YOURS</text>
  </g>
</svg>
